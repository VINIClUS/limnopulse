name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Release tag to promote (main-<40 hex sha>); its images and its workers bundle must already exist in GHCR"
        required: true
        type: string

permissions:
  contents: read

# One promotion at a time; a queued one waits instead of cancelling a running deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Pinned and checksum-verified, the same release ops/vps/README.md installs on the VPS.
  ORAS_VERSION: "1.3.6"
  ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    # Configured once in repo Settings > Environments as a manual bootstrap
    # step (Fase 1): add a required reviewer so this job never runs
    # unattended. Merge to main only builds and pushes (build.yml); this is
    # the sole path that touches production, and it is always human-gated.
    environment: production
    permissions:
      contents: read
      # gh attestation verify reads the bundle's build-provenance attestation.
      attestations: read
    steps:
      - name: Validate tag format
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tag="$IMAGE_TAG"
          if ! [[ "$tag" =~ ^main-[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must match ^main-[0-9a-f]{40}\$, got: $tag"
            exit 1
          fi

      - name: Install oras
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/oras"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/oras.tar.gz" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ORAS_SHA256" "$dir/oras.tar.gz" | sha256sum --check --strict -
          tar -xzf "$dir/oras.tar.gz" -C "$dir" oras
          rm -f "$dir/oras.tar.gz"
          echo "$dir" >> "$GITHUB_PATH"

      # A release without a workers bundle is refused here, before anything reaches the VPS.
      # The attestation must come from build.yml on main at the commit the tag names.
      - name: Pull and verify the workers bundle
        id: bundle
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$IMAGE_TAG"
          if ! [[ "$tag" =~ ^main-[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must match ^main-[0-9a-f]{40}\$"
            exit 1
          fi
          bundle_dir="$(mktemp -d)"
          trap 'rm -rf "$bundle_dir"' EXIT
          file="limnopulse-workers-${tag}.tar.gz"
          if ! oras pull --no-tty -o "$bundle_dir" "ghcr.io/viniclus/limnopulse/workers:${tag}"; then
            echo "::error::${tag} has no workers bundle in GHCR; refusing to deploy it"
            exit 1
          fi
          if [ "$(ls -A "$bundle_dir")" != "$file" ]; then
            echo "::error::the ${tag} workers bundle must contain exactly ${file}"
            exit 1
          fi
          gh attestation verify "$bundle_dir/$file" \
            --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/build.yml" \
            --source-ref refs/heads/main \
            --source-digest "${tag#main-}" \
            --deny-self-hosted-runners
          sha256="$(sha256sum "$bundle_dir/$file" | cut -d ' ' -f 1)"
          if ! [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::could not compute the bundle SHA-256"
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The forced command accepts exactly this request (deploy.forced_command in
          # ops/workers/roles.yaml); it travels as one SSH argument.
          request="$IMAGE_TAG $BUNDLE_SHA256"
          forced_command='^main-[0-9a-f]{40} [0-9a-f]{64}$'
          if ! [[ "$request" =~ $forced_command ]]; then
            echo "::error::the deploy request must be main-<40 hex> <64 hex>"
            exit 1
          fi
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
          ssh -i "$key_file" -o UserKnownHostsFile="$known_hosts_file" \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
              limnopulse-deploy@103.199.184.166 "$request"
