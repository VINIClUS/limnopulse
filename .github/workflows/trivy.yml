name: trivy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Trivy fs scan (dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,license'
          format: 'sarif'
          output: 'trivy-deps.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: '.worktrees,.venv,infra/opentofu/.terraform'
          trivyignores: '.trivyignore'
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: 'trivy-deps.sarif'
          category: 'trivy-dependencies'

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Trivy config scan (Dockerfiles, compose, OpenTofu)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          skip-dirs: '.worktrees,.venv,infra/opentofu/.terraform'
          trivyignores: '.trivyignore'
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - api
          - frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.app }} image (local, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          platforms: linux/amd64
          push: false
          load: true
          tags: limnopulse/${{ matrix.app }}:trivy-scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'limnopulse/${{ matrix.app }}:trivy-scan'
          format: 'sarif'
          output: 'trivy-image-${{ matrix.app }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: 'trivy-image-${{ matrix.app }}.sarif'
          category: 'trivy-image-${{ matrix.app }}'

  # ADR-020: the Go workers ship as static executables in the workers bundle, not as
  # images. A rootfs scan reads each binary's embedded module list.
  workers:
    runs-on: ubuntu-latest
    steps:
      # It builds pull-request code, so the checkout keeps no token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The latest patch of go.mod's Go minor, as the retired golang:1.26 images had: go.mod
      # names the oldest toolchain it accepts, and a release ships the newest stdlib fixes.
      # Each binary records the toolchain it was built with (go version -m).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Build the worker executables
        run: |
          uv sync --locked --extra dev
          make workers-binaries

      - name: Trivy rootfs scan (worker executables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'rootfs'
          scan-ref: 'dist/workers/bin'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-workers.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: 'trivy-workers.sarif'
          category: 'trivy-workers'
