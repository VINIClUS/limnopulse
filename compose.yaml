services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lfu
    ports:
      - "6379:6379"

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    # The image writes SQLite under the named volume; Docker creates that
    # volume root-owned on first use.
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath ./data
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    ports:
      - "8001:8000"

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.16
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "127.0.0.1:9324:9324"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - --header='Host: elasticmq:9324'
          'http://127.0.0.1:9324/?Action=ListQueues&Version=2012-11-05'
          >/dev/null || exit 1
      interval: 2s
      timeout: 2s
      retries: 30

  influxdb:
    image: influxdb:2-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: limnopulse
      DOCKER_INFLUXDB_INIT_PASSWORD: local-dev-password
      DOCKER_INFLUXDB_INIT_ORG: limnopulse
      DOCKER_INFLUXDB_INIT_BUCKET: limnopulse_raw
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: local-dev-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"

  mqtt-broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"

  telegraf:
    image: telegraf:1.32-alpine
    depends_on:
      - mqtt-broker
      - influxdb
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: local-dev-token
      INFLUXDB_ORG: limnopulse
      INFLUXDB_BUCKET_RAW: limnopulse_raw
    volumes:
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./infra/telegraf/device_registry.star:/etc/telegraf/device_registry.star:ro

  alert-evaluator:
    profiles: ["manual"]
    build:
      context: .
      dockerfile: Dockerfile.alert-evaluator
    depends_on:
      - dynamodb-local
      - influxdb
    environment:
      APP_ENV: local
      AWS_REGION: us-east-1
      DYNAMODB_DOMAIN_TABLE: LimnopulseDomain
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: local-dev-token
      INFLUXDB_ORG: limnopulse
      INFLUXDB_BUCKET_RAW: limnopulse_raw
      TELEGRAM_DELIVERY_ENABLED: "true"
    command: ["run"]
    restart: "no"

  notification-relay:
    profiles: ["notifications"]
    build:
      context: .
      dockerfile: Dockerfile.notifications
    depends_on:
      dynamodb-local:
        condition: service_started
      elasticmq:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: us-east-1
      DYNAMODB_DOMAIN_TABLE: LimnopulseDomain
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_NOTIFICATION_JOBS_URL: http://elasticmq:9324/000000000000/limnopulse-notification-jobs
      SQS_TELEGRAM_JOBS_URL: http://elasticmq:9324/000000000000/limnopulse-telegram-notification-jobs
      TELEGRAM_DELIVERY_ENABLED: "true"
      LIMNOPULSE_WEB_URL: http://localhost:3000
    command: ["relay"]
    restart: "no"

  notification-worker:
    profiles: ["notifications"]
    build:
      context: .
      dockerfile: Dockerfile.notifications
    depends_on:
      dynamodb-local:
        condition: service_started
      elasticmq:
        condition: service_healthy
    environment:
      APP_ENV: local
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: us-east-1
      DYNAMODB_DOMAIN_TABLE: LimnopulseDomain
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_NOTIFICATION_JOBS_URL: http://elasticmq:9324/000000000000/limnopulse-notification-jobs
      SQS_SES_EVENTS_URL: http://elasticmq:9324/000000000000/limnopulse-ses-events
      SES_FROM_EMAIL: alerts@example.test
      SES_CONFIGURATION_SET_NAME: limnopulse-notifications
      NOTIFICATION_EMAIL_SENDER_MODE: success
      NOTIFICATION_MAX_SEND_RATE: "10"
    command: ["worker"]
    init: true
    stop_grace_period: 45s
    restart: unless-stopped

  telegram-bot-api-fake:
    profiles: ["notifications"]
    image: wiremock/wiremock:3.13.1-alpine
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - ./infra/telegram/wiremock:/home/wiremock/mappings:ro

  telegram-notification-worker:
    profiles: ["notifications"]
    build:
      context: .
      dockerfile: Dockerfile.notifications
    depends_on:
      dynamodb-local:
        condition: service_started
      elasticmq:
        condition: service_healthy
      redis:
        condition: service_started
      telegram-bot-api-fake:
        condition: service_started
    environment:
      APP_ENV: local
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: us-east-1
      DYNAMODB_DOMAIN_TABLE: LimnopulseDomain
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_TELEGRAM_JOBS_URL: http://elasticmq:9324/000000000000/limnopulse-telegram-notification-jobs
      REDIS_ADDR: redis:6379
      TELEGRAM_DELIVERY_ENABLED: "true"
      TELEGRAM_BOT_TOKEN: 123456:local-test-token
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api-fake:8080
    command: ["telegram-worker"]
    init: true
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  dynamodb_data:
  influxdb_data:
