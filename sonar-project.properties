sonar.projectKey=VINIClUS_limnopulse
sonar.organization=viniclus

sonar.sources=src,cmd,internal,ops,scripts
sonar.tests=tests
sonar.test.inclusions=**/test_*.py,**/*_test.go

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.go.coverage.reportPaths=coverage.out

sonar.exclusions=\
  .worktrees/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  infra/opentofu/.terraform/**,\
  testdata/**,\
  examples/**,\
  docs/**

sonar.coverage.exclusions=tests/**,scripts/dev/**,ops/lab/**
